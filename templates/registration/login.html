{% extends "base.html" %}

{% block content %}
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Log in</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
